<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Beauty Studio</title>
<link rel="stylesheet" href="css/style.css?v=3">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=3"></script>
<script src="js/db.js?v=3"></script>
<script src="js/app.js?v=3"></script>
</head>
<body>
<header id="site-header"></header>

<div class="auth-bg" style="align-items:center">
  <div class="auth-card">
    <div class="eyebrow">Вход</div>
    <h2>С возвращением,<br><span class="ac">мастер</span></h2>
    <p class="lead">Войдите, чтобы забронировать рабочее место.</p>
    <form class="form" id="login-form" novalidate>
      <div class="field"><label for="email">Email</label><input class="input" id="email" type="email" autocomplete="email" placeholder="you@example.com" required><div class="err"></div></div>
      <div class="field"><label for="password"><span>Пароль</span><button type="button" class="linkbtn" id="forgot" style="text-decoration:underline">Забыли пароль?</button></label><div class="pw-wrap"><input class="input" id="password" type="password" autocomplete="current-password" placeholder="Ваш пароль" required><button type="button" class="pw-toggle">показать</button></div><div class="err"></div></div>
      <label class="check"><input type="checkbox" id="remember" checked><span>Запомнить меня на этом устройстве</span></label>
      <div class="form-msg" id="msg"></div>
      <button class="btn block" type="submit" id="submit">Войти</button>
    </form>
    <div class="divider">нет аккаунта?</div>
    <p class="center"><a class="linkbtn ul" href="register.html">Создать аккаунт ›</a></p>
  </div>
</div>

<script>
(async () => {
  const ctx = await BS.init({ redirectIfAuthed: true, simple: true }); if (!ctx) return;
  const { $, setErr, showMsg, busy } = BS;
  const next = new URLSearchParams(location.search).get('next');
  if (location.hash.includes('type=signup')) showMsg($('#msg'), 'Email подтверждён. Теперь войдите.', 'ok');
  $('#login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $('#email').value.trim(), pw = $('#password').value;
    let ok = true;
    setErr($('#email').closest('.field'), !/^\S+@\S+\.\S+$/.test(email) ? 'Введите корректный email' : ''); ok &= /^\S+@\S+\.\S+$/.test(email);
    setErr($('#password').closest('.field'), !pw ? 'Введите пароль' : ''); ok &= !!pw;
    if (!ok) return;
    busy($('#submit'), true, 'Входим…');
    try {
      const u = await DB.auth.signIn(email, pw);
      BS.toast(`Здравствуйте, ${u.name || 'мастер'}!`);
      location.href = next || (u.role === 'admin' ? 'admin/index.html' : 'account.html');
    } catch (err) { showMsg($('#msg'), err.message); busy($('#submit'), false); }
  });
  $('#forgot').onclick = async () => {
    const email = $('#email').value.trim();
    if (!/^\S+@\S+\.\S+$/.test(email)) { setErr($('#email').closest('.field'), 'Введите email, на который отправить ссылку'); return; }
    try { await DB.auth.resetPassword(email); showMsg($('#msg'), 'Ссылка для сброса пароля отправлена на ' + email, 'ok'); }
    catch (err) { showMsg($('#msg'), err.message); }
  };
})();
</script>
</body>
</html>
