<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Профиль — Beauty Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
</head>
<body>
<header id="site-header"></header>

<div class="container" style="max-width:760px">
  <div class="page-head"><div><div class="eyebrow">Личный кабинет</div><h1 style="font-size:clamp(30px,5vw,52px)">Профиль</h1></div></div>

  <div class="card">
    <div class="row" style="gap:18px"><div class="avatar lg" id="ava">?</div><div><h3 id="p-name">—</h3><p class="muted" id="p-email">—</p><span class="badge gray mt-1" id="p-since">—</span></div></div>
    <div class="mt-3">
      <div class="prof-row"><div><div class="k">Имя</div><div class="v" id="v-name">—</div></div><button class="linkbtn" data-edit="name">Изменить</button></div>
      <div class="prof-row"><div><div class="k">Телефон</div><div class="v" id="v-phone">—</div></div><button class="linkbtn" data-edit="phone">Изменить</button></div>
      <div class="prof-row"><div><div class="k">Email</div><div class="v" id="v-email">—</div></div><span class="muted small">Используется для входа</span></div>
    </div>
  </div>

  <div class="card mt-3">
    <h3>Безопасность</h3>
    <div class="prof-row"><div><div class="k">Пароль</div><div class="v">••••••••</div></div><button class="btn light sm" id="pw-btn">Сменить пароль</button></div>
    <div class="prof-row"><div><div class="k">Сессия</div><div class="v">Вы вошли в аккаунт</div></div><button class="btn light sm" id="logout">Выйти</button></div>
  </div>

  <div class="card mt-3 danger-zone">
    <h3 style="color:var(--danger)">Опасная зона</h3>
    <p class="muted small mt-1">Удаление аккаунта необратимо: все брони будут отменены, данные удалены.</p>
    <button class="btn danger sm mt-2" id="del-btn">Удалить аккаунт</button>
  </div>
</div>

<footer id="site-footer"></footer>
<script>
(async () => {
  const ctx = await BS.init({ auth: true }); if (!ctx) return;
  let { user } = ctx; const { $, $$, esc, toast, modal, closeModal } = BS;

  function render() {
    $('#ava').textContent = (user.name || user.email || '?').trim()[0].toUpperCase();
    $('#p-name').textContent = user.name || 'Мастер'; $('#p-email').textContent = user.email;
    $('#p-since').textContent = user.created_at ? 'С нами с ' + BS.fmtDate(user.created_at.slice(0, 10)) + ' ' + new Date(user.created_at).getFullYear() : 'Мастер';
    $('#v-name').textContent = user.name || '—'; $('#v-phone').textContent = user.phone || 'не указан'; $('#v-email').textContent = user.email;
  }
  render();

  // inline‑редактирование
  $$('[data-edit]').forEach((btn) => (btn.onclick = () => {
    const f = btn.dataset.edit; const row = btn.closest('.prof-row'); const v = $('.v', row); const old = user[f] || '';
    v.innerHTML = `<div class="edit-input"><input class="input" id="edit-${f}" value="${esc(old)}" ${f === 'phone' ? 'type="tel" inputmode="tel"' : ''} style="padding:9px 12px;max-width:260px"><button class="btn sm" id="save-${f}">Сохранить</button><button class="btn light sm" id="cancel-${f}">Отмена</button></div>`;
    btn.classList.add('hidden');
    const inp = $('#edit-' + f); if (f === 'phone') BS.phoneMask(inp); inp.focus();
    const done = () => { btn.classList.remove('hidden'); render(); };
    $('#cancel-' + f).onclick = done;
    $('#save-' + f).onclick = async () => {
      const val = inp.value.trim();
      if (f === 'name' && val.length < 2) { toast('Введите имя', 'error'); return; }
      if (f === 'phone' && val && val.replace(/\D/g, '').length !== 11) { toast('Введите телефон полностью', 'error'); return; }
      try { user = await DB.auth.updateProfile({ [f]: val }); toast('Сохранено'); done(); } catch (e) { toast(e.message, 'error'); }
    };
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#save-' + f).click(); if (e.key === 'Escape') done(); });
  }));

  $('#pw-btn').onclick = () => modal(`<h3>Сменить пароль</h3><p class="muted small">Новый пароль — не короче 6 символов.</p>
    <div class="form mt-3"><div class="field"><label>Новый пароль</label><div class="pw-wrap"><input class="input" id="npw" type="password" autocomplete="new-password"><button type="button" class="pw-toggle">${BS.ICON.eye}</button></div></div>
    <div class="field"><label>Повторите пароль</label><input class="input" id="npw2" type="password" autocomplete="new-password"></div><div class="form-msg" id="pw-msg"></div></div>
    <div class="actions"><button class="btn light" data-close>Отмена</button><button class="btn" id="pw-save">Сохранить</button></div>`,
    { onOpen: (m) => { BS.pwToggles(m); $('#pw-save', m).onclick = async () => {
      const a = $('#npw', m).value, b = $('#npw2', m).value;
      if (a.length < 6) return BS.showMsg($('#pw-msg', m), 'Пароль не короче 6 символов');
      if (a !== b) return BS.showMsg($('#pw-msg', m), 'Пароли не совпадают');
      BS.busy($('#pw-save', m), true);
      try { await DB.auth.changePassword(a); closeModal(); toast('Пароль изменён'); } catch (e) { BS.showMsg($('#pw-msg', m), e.message); BS.busy($('#pw-save', m), false); }
    }; } });

  $('#logout').onclick = async () => { await DB.auth.signOut(); location.href = 'index.html'; };
  $('#del-btn').onclick = async () => {
    if (!(await BS.confirmDlg('Удалить аккаунт?', 'Это действие нельзя отменить. Все ваши брони будут удалены.', { ok: 'Удалить навсегда', danger: true }))) return;
    try { await DB.auth.deleteAccount(); toast('Аккаунт удалён'); location.href = 'index.html'; } catch (e) { toast(e.message, 'error'); }
  };
})();
</script>
</body>
</html>
