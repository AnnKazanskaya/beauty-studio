<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Расписание — Beauty Studio Admin</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/db.js"></script>
<script src="../js/app.js"></script>
<script src="../js/admin.js"></script>
</head>
<body>
<div class="admin-topbar" id="topbar"></div>
<div class="admin">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="admin-main">
    <div class="admin-head"><div class="eyebrow">Управление</div><h1>Расписание <span class="ac">салона</span></h1></div>
    <div class="two-wide" style="grid-template-columns:360px 1fr">
      <div class="cal" id="cal"></div>
      <div class="card">
        <div class="slots-head"><div><h3>Слоты на день</h3><div class="muted" id="day-label"></div></div><div class="row" id="day-badges"></div></div>
        <div id="slots"></div>
        <div class="mt-4" style="border-top:1px solid var(--line);padding-top:24px"><h3 style="font-size:17px">Брони на этот день</h3><div class="list-rows mt-1" id="table"></div></div>
      </div>
    </div>
  </main>
</div>
<script>
(async () => {
  const ctx = await ADMIN.init(); if (!ctx) return;
  const { settings } = ctx; const { $, $$, esc, iso, parse, today, fmtDate, fmtDateDow, fmtHour, money, toast, plural, dayHours, modal, closeModal, seatName } = BS;
  const nSeats = BS.seats(settings); const hours = dayHours(settings);
  const state = { month: parse(today()), date: today(), bookings: [], closed: [] };
  state.month.setDate(1);
  const p = new URLSearchParams(location.search); if (p.get('d')) { state.date = p.get('d'); state.month = parse(state.date); state.month.setDate(1); }

  async function loadRange() {
    const from = iso(state.month); const to = iso(new Date(state.month.getFullYear(), state.month.getMonth() + 1, 0));
    try { [state.bookings, state.closed] = await Promise.all([DB.bookings.all({ from, to }), DB.slots.closed(from, to)]); } catch (e) { toast(e.message, 'error'); }
  }
  const active = () => state.bookings.filter((b) => b.status === 'active');
  const dayClosedRec = (d) => state.closed.find((c) => c.date === d && c.hour === null && c.seat === null);
  const closedRec = (d, h, s) => state.closed.find((c) => c.date === d && (c.hour === null || c.hour === h) && (c.seat === null || c.seat === s));
  const bookingAt = (d, h, s) => active().find((b) => b.date === d && b.hour === h && b.seat === s);

  function renderCal() {
    const y = state.month.getFullYear(), m = state.month.getMonth();
    const startDow = (new Date(y, m, 1).getDay() + 6) % 7; const days = new Date(y, m + 1, 0).getDate();
    let cells = BS.DOW.map((d, i) => `<div class="dow ${i >= 5 ? 'we' : ''}">${d}</div>`).join(''); for (let i = 0; i < startDow; i++) cells += '<div></div>';
    for (let d = 1; d <= days; d++) {
      const ds = iso(new Date(y, m, d)); const n = active().filter((b) => b.date === ds).length;
      cells += `<button class="cal-day ${ds === state.date ? 'selected' : ''} ${dayClosedRec(ds) ? 'closed' : ''}" data-d="${ds}">${d}${ds === today() ? '<span class="m"></span>' : ''}${n ? `<span class="cnt">${n}</span>` : ''}</button>`;
    }
    const dayClosed = dayClosedRec(state.date);
    $('#cal').innerHTML = `<div class="cal-head"><b>${BS.MONTHS_NOM[m]} ${y}</b><div class="cal-nav"><button id="prev">‹</button><button id="next">›</button></div></div><div class="cal-grid">${cells}</div>
      <div class="cal-legend" style="display:block">${dayClosed ? `<button class="btn outline block" id="open-day">Открыть день</button>` : `<button class="btn outline block" id="close-day">Закрыть весь день</button>`}</div>`;
    $('#prev').onclick = async () => { state.month = new Date(y, m - 1, 1); await loadRange(); renderCal(); };
    $('#next').onclick = async () => { state.month = new Date(y, m + 1, 1); await loadRange(); renderCal(); };
    $$('.cal-day').forEach((b) => (b.onclick = () => { state.date = b.dataset.d; renderCal(); renderDay(); }));
    const cd = $('#close-day'); if (cd) cd.onclick = async () => { if (!(await BS.confirmDlg('Закрыть весь день?', `${fmtDate(state.date)}: новые брони будут невозможны. Существующие брони не отменяются автоматически.`, { ok: 'Закрыть день', danger: true }))) return; try { await DB.slots.closeDay(state.date); toast('День закрыт'); await refresh(); } catch (e) { toast(e.message, 'error'); } };
    const od = $('#open-day'); if (od) od.onclick = async () => { try { await DB.slots.openDay(state.date); toast('День открыт'); await refresh(); } catch (e) { toast(e.message, 'error'); } };
  }

  function renderDay() {
    const d = state.date; const root = $('#slots'); root.style.setProperty('--hours', hours.length);
    $('#day-label').textContent = fmtDateDow(d);
    const dayClosed = dayClosedRec(d);
    let busy = 0, closedN = 0;
    let grid = `<div class="slot-scroll"><div class="slot-table"><div></div>${hours.map((h) => `<div class="th">${fmtHour(h)}</div>`).join('')}`;
    for (let s = 1; s <= nSeats; s++) {
      grid += `<div class="seat">${esc(seatName(settings, s))}</div>`;
      hours.forEach((h) => { const b = bookingAt(d, h, s); const c = closedRec(d, h, s);
        if (b) { busy++; grid += `<button class="slot busy" data-h="${h}" data-s="${s}">${fmtHour(h)}<span class="nm">${esc((b.profile?.name || 'Мастер').split(' ')[0])}</span></button>`; }
        else if (c) { closedN++; grid += `<button class="slot closed" data-h="${h}" data-s="${s}">${fmtHour(h)}</button>`; }
        else grid += `<button class="slot" data-h="${h}" data-s="${s}">${fmtHour(h)}</button>`; });
    }
    grid += '</div></div><p class="muted small mt-2">Нажмите на слот, чтобы открыть меню действий.</p>';
    root.innerHTML = dayClosed ? `<div class="empty"><b>День закрыт</b>${esc(dayClosed.reason || '')}</div>` : grid;
    $('#day-badges').innerHTML = `<span class="badge pink"><span class="dot"></span> ${busy} занято</span><span class="badge gray"><span class="dot"></span> ${closedN} закрыто</span>`;
    $$('.slot', root).forEach((el) => (el.onclick = () => slotMenu(+el.dataset.h, +el.dataset.s)));

    const groups = ADMIN.groupBookings(state.bookings.filter((b) => b.date === d && b.status === 'active')).sort((a, b) => a.items[0].hour - b.items[0].hour);
    $('#table').innerHTML = groups.length ? groups.map((g) => `<div>
      <div class="time"><b>${fmtHour(g.items[0].hour)}</b><span>${g.items.length > 1 ? 'до ' + fmtHour(g.items[g.items.length - 1].hour + 1) : ''}</span></div>
      <span class="avatar sm">${ADMIN.initial(g.profile?.name)}</span>
      <div class="who"><b>${esc(g.profile?.name || '—')}</b><span>${esc(g.profile?.phone || g.profile?.email || '')}</span></div>
      <span class="muted small">Место: <b style="color:var(--ink)">${esc(seatName(settings, g.seat))}</b></span>
      <button class="btn outline pink sm" data-cancel="${g.ids.join(',')}">Отменить</button></div>`).join('') : '<div class="empty" style="padding:24px">Броней на этот день нет</div>';
    $$('[data-cancel]').forEach((b) => (b.onclick = () => cancelIds(b.dataset.cancel.split(','))));
  }

  async function cancelIds(ids) {
    if (!(await BS.confirmDlg('Отменить бронь мастера?', `Будет отменено ${plural(ids.length, 'слот', 'слота', 'слотов')}. Мастеру стоит сообщить об этом.`, { ok: 'Отменить бронь', danger: true }))) return;
    try { for (const id of ids) await DB.bookings.adminCancel(id); toast('Бронь отменена'); await refresh(); } catch (e) { toast(e.message, 'error'); }
  }
  function slotMenu(h, s) {
    const d = state.date; const b = bookingAt(d, h, s); const c = closedRec(d, h, s);
    const title = `${fmtDate(d)}, ${fmtHour(h)} · ${esc(seatName(settings, s))}`;
    let body = '', actions = '';
    if (b) { body = `<div class="row mt-3" style="gap:14px"><span class="avatar">${ADMIN.initial(b.profile?.name)}</span><div><b>${esc(b.profile?.name || 'Мастер')}</b><br><span class="muted small">${esc(b.profile?.phone || '')} · ${esc(b.profile?.email || '')}</span></div></div><p class="muted small mt-2">Бронь создана ${BS.rel(b.created_at)} · ${money(b.price || 0)}</p>`;
      actions = `<button class="btn outline red" id="act-cancel">Отменить этот час</button>`; }
    else if (c) { body = `<p class="mt-2">Слот закрыт${c.reason ? ': ' + esc(c.reason) : ''}${c.hour === null ? ' (закрыт весь день)' : c.seat === null ? ' (закрыт час на всех местах)' : ''}.</p>`;
      actions = `<button class="btn" id="act-open">Открыть слот</button>`; }
    else { body = `<p class="mt-2 muted">Слот свободен.</p><div class="field mt-3"><label>Причина закрытия (необязательно)</label><input class="input" id="reason" placeholder="Например: уборка, ремонт кресла"></div>`;
      actions = `<button class="btn" id="act-close">Закрыть слот</button><button class="btn outline" id="act-close-all">Закрыть час на всех местах</button>`; }
    modal(`<h3>${title}</h3>${body}<div class="actions">${actions}<button class="btn outline" data-close>Закрыть окно</button></div>`, { onOpen: (m) => {
      const q = (id) => $(id, m);
      if (q('#act-cancel')) q('#act-cancel').onclick = () => { closeModal(); cancelIds([b.id]); };
      if (q('#act-open')) q('#act-open').onclick = async () => { try { await DB.slots.open(c.id); closeModal(); toast('Слот открыт'); await refresh(); } catch (e) { toast(e.message, 'error'); } };
      if (q('#act-close')) q('#act-close').onclick = async () => { try { await DB.slots.close({ date: d, hour: h, seat: s, reason: q('#reason').value.trim() }); closeModal(); toast('Слот закрыт'); await refresh(); } catch (e) { toast(e.message, 'error'); } };
      if (q('#act-close-all')) q('#act-close-all').onclick = async () => { try { await DB.slots.close({ date: d, hour: h, seat: null, reason: q('#reason').value.trim() }); closeModal(); toast('Час закрыт на всех местах'); await refresh(); } catch (e) { toast(e.message, 'error'); } };
    } });
  }
  async function refresh() { await loadRange(); renderCal(); renderDay(); }
  await refresh();
})();
</script>
</body>
</html>
