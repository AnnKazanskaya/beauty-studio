<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бронирование — Beauty Studio</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
</head>
<body class="has-bookbar">
<header id="site-header"></header>

<div class="container">
  <div class="page-head">
    <div><div class="eyebrow">Бронирование</div><h1>Выберите дату <span class="ac">и время</span></h1><p class="lead">Можно выбрать несколько слотов сразу — на разных местах и в разное время. Подтвердите бронь внизу страницы.</p></div>
  </div>
  <div id="notice"></div>
  <div class="two-wide">
    <div class="cal" id="cal"></div>
    <div class="slots" id="slots"></div>
  </div>
</div>

<div class="bookbar" id="bookbar">
  <div class="container">
    <div><div class="muted small" id="bar-sub">Выбрано 0 слотов</div><b id="bar-total">0 ₽</b></div>
    <div class="row"><button class="clr" id="bar-clear">Очистить</button><button class="btn" id="bar-book">Подтвердить бронь ›</button></div>
  </div>
</div>

<footer id="site-footer"></footer>
<script src="js/booking.js"></script>
</body>
</html>
