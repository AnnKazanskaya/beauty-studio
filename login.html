<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Beauty Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
</head>
<body>
<header id="site-header"></header>

<div class="auth-wrap">
  <div class="card auth-card">
    <div class="eyebrow">Вход</div>
    <h2>С возвращением</h2>
    <p class="muted mb-3">Войдите, чтобы бронировать и управлять записями.</p>
    <form class="form" id="login-form" novalidate>
      <div class="field"><label for="email">Email</label><input class="input" id="email" type="email" autocomplete="email" placeholder="you@example.com" required><div class="err"></div></div>
      <div class="field"><label for="password">Пароль</label><div class="pw-wrap"><input class="input" id="password" type="password" autocomplete="current-password" required><button type="button" class="pw-toggle" aria-label="Показать пароль"></button></div><div class="err"></div></div>
      <div class="row between">
        <label class="check"><input type="checkbox" id="remember" checked><span>Запомнить меня</span></label>
        <button type="button" class="linkbtn" id="forgot">Забыли пароль?</button>
      </div>
      <div class="form-msg" id="msg"></div>
      <button class="btn block" type="submit" id="submit">Войти</button>
    </form>
    <p class="muted small mt-3" style="text-align:center">Нет аккаунта? <a href="register.html" class="pink" style="font-weight:700">Зарегистрироваться</a></p>
  </div>
</div>

<footer id="site-footer"></footer>
<script>
(async () => {
  const ctx = await BS.init({ redirectIfAuthed: true }); if (!ctx) return;
  const { $, setErr, showMsg, busy } = BS;
  $('.pw-toggle').innerHTML = BS.ICON.eye;
  const next = new URLSearchParams(location.search).get('next');
  if (location.hash.includes('type=signup')) showMsg($('#msg'), 'Email подтверждён. Теперь войдите.', 'ok');
  $('#login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $('#email').value.trim(), pw = $('#password').value;
    let ok = true;
    setErr($('#email').closest('.field'), !/^\S+@\S+\.\S+$/.test(email) ? 'Введите корректный email' : ''); ok &= /^\S+@\S+\.\S+$/.test(email);
    setErr($('#password').closest('.field'), !pw ? 'Введите пароль' : ''); ok &= !!pw;
    if (!ok) return;
    busy($('#submit'), true, 'Входим…');
    try {
      const u = await DB.auth.signIn(email, pw);
      BS.toast(`Здравствуйте, ${u.name || 'мастер'}!`);
      location.href = next || (u.role === 'admin' ? 'admin/index.html' : 'account.html');
    } catch (err) { showMsg($('#msg'), err.message); busy($('#submit'), false); }
  });
  $('#forgot').onclick = async () => {
    const email = $('#email').value.trim();
    if (!/^\S+@\S+\.\S+$/.test(email)) { setErr($('#email').closest('.field'), 'Введите email, на который отправить ссылку'); return; }
    try { const r = await DB.auth.resetPassword(email); showMsg($('#msg'), r && r.demo ? 'В демо‑режиме восстановление недоступно. Пароль мастера: 123456' : 'Ссылка для сброса пароля отправлена на ' + email, 'ok'); }
    catch (err) { showMsg($('#msg'), err.message); }
  };
})();
</script>
</body>
</html>
