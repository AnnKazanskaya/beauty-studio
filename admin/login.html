<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход в админ‑панель — InBeauty</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../css/style.css?v=4">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js?v=4"></script>
<script src="../js/db.js?v=4"></script>
<script src="../js/app.js?v=4"></script>
</head>
<body style="background:#f7f7f7">
<header class="header simple dark"><div class="container"><a class="logo" href="../index.html" style="color:#fff"><i></i>INBEAUTY <span class="badge tag" style="margin-left:10px">Admin</span></a><a class="back" href="../index.html">‹ На сайт</a></div></header>

<div class="auth-bg gray" style="align-items:center">
  <div class="auth-card">
    <span class="icon-circle dark" style="width:64px;height:64px;font-size:20px;margin-bottom:28px">◆</span>
    <div class="eyebrow">Админ‑панель</div>
    <h2>Вход для администратора</h2>
    <p class="lead">Только владелец салона имеет доступ к этому разделу.</p>
    <form class="form" id="form" novalidate>
      <div class="field"><label for="email">Email</label><input class="input" id="email" type="email" autocomplete="username" placeholder="admin@inbeauty.ru" required></div>
      <div class="field"><label for="password">Пароль</label><div class="pw-wrap"><input class="input" id="password" type="password" autocomplete="current-password" placeholder="Ваш пароль администратора" required><button type="button" class="pw-toggle">показать</button></div></div>
      <div class="form-msg" id="msg"></div>
      <button class="btn block" type="submit" id="submit">Войти в админку</button>
    </form>
    <div class="divider" style="margin-bottom:0"></div>
    <p class="center muted small mt-3">Если вы мастер, а не администратор —<br><a href="../login.html" style="text-decoration:underline;color:var(--ink)">войдите в обычный аккаунт</a></p>
  </div>
</div>
<script>
(async () => {
  const { $, showMsg, busy } = BS; BS.pwToggles();
  const me = await DB.auth.me().catch(() => null);
  if (me && me.role === 'admin') { location.replace('index.html'); return; }
  $('#form').addEventListener('submit', async (e) => {
    e.preventDefault(); busy($('#submit'), true, 'Проверяем…');
    try {
      const u = await DB.auth.signIn($('#email').value, $('#password').value);
      if (u.role !== 'admin') { await DB.auth.signOut(); throw new Error('У этого аккаунта нет прав администратора'); }
      location.href = 'index.html';
    } catch (err) { showMsg($('#msg'), err.message); busy($('#submit'), false); }
  });
})();
</script>
</body>
</html>
