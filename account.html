<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мои записи — InBeauty</title>
<link rel="stylesheet" href="css/style.css?v=4">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=4"></script>
<script src="js/db.js?v=4"></script>
<script src="js/app.js?v=4"></script>
</head>
<body>
<header id="site-header"></header>

<div class="container mid">
  <div class="page-head">
    <div><div class="eyebrow">Личный кабинет</div><h1>Мои <span class="ac">записи</span></h1></div>
    <a class="btn" href="booking.html">+ Новая бронь</a>
  </div>
  <div class="tabs mb-3">
    <button class="tab active" data-tab="up">Предстоящие <span class="cnt" id="cnt-up">0</span></button>
    <button class="tab" data-tab="past">Прошедшие <span class="cnt" id="cnt-past">0</span></button>
  </div>
  <div class="grid" id="list"><div class="empty">Загружаем…</div></div>
</div>

<footer id="site-footer"></footer>
<script>
(async () => {
  const ctx = await BS.init({ auth: true }); if (!ctx) return;
  const { settings } = ctx; const { $, $$, esc, hoursToRanges, money, toast, canCancel, plural, seatName } = BS;
  let tab = 'up', bookings = [];

  function groups(list) {
    const g = {};
    list.forEach((b) => { const k = b.date + '|' + b.seat + '|' + b.status; (g[k] ||= { date: b.date, seat: b.seat, status: b.status, items: [] }).items.push(b); });
    return Object.values(g).map((x) => ({ ...x, items: x.items.sort((a, b) => a.hour - b.hour), sum: x.items.reduce((s, i) => s + (i.price || 0), 0) }));
  }
  const isPast = (g) => BS.slotStart(g.date, g.items[g.items.length - 1].hour).getTime() + 36e5 <= Date.now();

  async function load() {
    try { bookings = await DB.bookings.mine(); } catch (e) { toast(e.message, 'error'); bookings = []; }
    render();
  }
  function render() {
    const all = groups(bookings);
    const up = all.filter((g) => g.status === 'active' && !isPast(g)).sort((a, b) => (a.date + BS.pad(a.items[0].hour)).localeCompare(b.date + BS.pad(b.items[0].hour)));
    const past = all.filter((g) => g.status !== 'active' || isPast(g)).sort((a, b) => (b.date + BS.pad(b.items[0].hour)).localeCompare(a.date + BS.pad(a.items[0].hour)));
    $('#cnt-up').textContent = up.length; $('#cnt-past').textContent = past.length;
    const list = tab === 'up' ? up : past;
    if (!list.length) { $('#list').innerHTML = `<div class="empty card"><b>${tab === 'up' ? 'Пока нет предстоящих броней' : 'Прошедших броней нет'}</b>${tab === 'up' ? 'Выберите удобные часы в календаре.' : 'Здесь появится история ваших визитов.'}<div class="mt-3"><a class="btn sm" href="booking.html">Забронировать</a></div></div>`; return; }
    $('#list').innerHTML = list.map((g) => {
      const d = BS.parse(g.date); const cancellable = g.status === 'active' && g.items.every((b) => canCancel(b, settings));
      const status = g.status === 'cancelled' ? '<span class="badge red"><span class="dot"></span> Отменена</span>' : isPast(g) ? '<span class="badge gray"><span class="dot"></span> Завершена</span>' : '<span class="badge green"><span class="dot"></span> Подтверждена</span>';
      return `<div class="card bk-card ${tab === 'past' ? 'past' : ''}">
        <div class="bk-date"><b>${d.getDate()}</b><span class="mo">${BS.MONTHS_SHORT[d.getMonth()]}</span><span class="dw">${BS.DOW_FULL[BS.dowIdx(g.date)]}</span></div>
        <div class="bk-info"><div class="t">${hoursToRanges(g.items.map((i) => i.hour))} <span class="badge pink"><span class="dot"></span> ${esc(seatName(settings, g.seat))}</span></div>
          <div class="c">Стоимость: <b>${money(g.sum)}</b> &nbsp; Оплата на месте</div><div>${status}</div></div>
        <div>${g.status === 'active' && !isPast(g) ? (cancellable ? `<button class="btn outline pink sm" data-cancel="${g.items.map((i) => i.id).join(',')}">Отменить бронь</button>` : `<span class="muted small">Отмена недоступна:<br>до начала меньше ${settings.rules.cancelHours} ч</span>`) : ''}</div>
      </div>`;
    }).join('');
    $$('[data-cancel]').forEach((b) => (b.onclick = async () => {
      const ids = b.dataset.cancel.split(',');
      if (!(await BS.confirmDlg('Отменить бронь?', `Будет отменено ${plural(ids.length, 'слот', 'слота', 'слотов')}. Место снова станет доступно другим мастерам.`, { ok: 'Отменить бронь', danger: true }))) return;
      try { for (const id of ids) await DB.bookings.cancel(id); toast('Бронь отменена'); await load(); } catch (e) { toast(e.message, 'error'); }
    }));
  }
  $$('.tab').forEach((t) => (t.onclick = () => { $$('.tab').forEach((x) => x.classList.remove('active')); t.classList.add('active'); tab = t.dataset.tab; render(); }));
  await load();
})();
</script>
</body>
</html>
